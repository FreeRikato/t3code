name: Build iOS IPA

on:
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: t3code/mobile-remote-connect

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: npx expo prebuild --platform ios --clean

      - name: Find workspace and scheme
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "Found workspace: $WORKSPACE"
          # List all available schemes
          echo "Available schemes:"
          xcodebuild -workspace "$WORKSPACE" -list 2>&1 || true
          # Pick first scheme
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>&1 | awk '/Schemes:/,0' | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Using scheme: $SCHEME"

      - name: Build iOS app (no code signing)
        working-directory: apps/mobile/ios
        run: |
          set -e
          echo "Building with workspace: $WORKSPACE, scheme: $SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            2>&1 | tail -50

      - name: Find built .app and package as IPA
        run: |
          set -e
          echo "Searching for .app in DerivedData..."
          find "$RUNNER_TEMP/DerivedData" -name "*.app" -not -path "*/PlugIns/*" -not -name "*.appex" 2>/dev/null
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" -not -path "*/PlugIns/*" -not -name "*.appex" | grep -i "iphoneos" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Falling back to any .app..."
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" -not -path "*/PlugIns/*" -not -name "*.appex" | head -1)
          fi
          echo "Using app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r T3Code-Preview.ipa Payload/
          echo "IPA size: $(du -sh T3Code-Preview.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: T3Code-Preview-IPA
          path: ${{ runner.temp }}/T3Code-Preview.ipa
          retention-days: 7
