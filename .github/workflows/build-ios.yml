name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: t3code/mobile-remote-connect

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: npx expo prebuild --platform ios --clean

      - name: Find workspace and scheme
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "Found workspace: $WORKSPACE"
          echo "=== Available schemes ==="
          xcodebuild -workspace "$WORKSPACE" -list 2>&1
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>&1 | awk '/Schemes:/,0' | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Using scheme: $SCHEME"

      - name: Build iOS app
        working-directory: apps/mobile/ios
        run: |
          # Full output - no piping, no masking
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE=""

      - name: List DerivedData contents
        if: always()
        run: |
          echo "=== All .app bundles found ==="
          find "$RUNNER_TEMP/DerivedData" -name "*.app" 2>/dev/null || echo "None found"
          echo "=== DerivedData top-level dirs ==="
          find "$RUNNER_TEMP/DerivedData" -maxdepth 5 -type d 2>/dev/null | head -40

      - name: Package as IPA
        run: |
          set -e
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" \
            -not -path "*/PlugIns/*" \
            -not -name "*.appex" \
            2>/dev/null | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r T3Code-Preview.ipa Payload/
          echo "IPA size: $(du -sh T3Code-Preview.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: T3Code-Preview-IPA
          path: ${{ runner.temp }}/T3Code-Preview.ipa
          retention-days: 7
