name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: t3code/mobile-remote-connect

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo prebuild (iOS, skip pod install)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: npx expo prebuild --platform ios --clean --no-install

      # Fix 1: Xcode 16.x breaks xcodeproj gem — patch it before pod install
      - name: Patch xcodeproj gem for Xcode 16
        run: |
          XCODEPROJ_CONSTANTS=$(gem contents xcodeproj | grep constants.rb | head -1)
          if [ -n "$XCODEPROJ_CONSTANTS" ]; then
            XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)
            echo "Xcode major version: $XCODE_VERSION"
            if [ "$XCODE_VERSION" -ge 16 ]; then
              sudo sed -i '' \
                "s/LAST_KNOWN_OBJECT_VERSION = [0-9]*/LAST_KNOWN_OBJECT_VERSION = 77/" \
                "$XCODEPROJ_CONSTANTS" 2>/dev/null || true
              echo "xcodeproj patched for Xcode 16"
            fi
          fi

      # Fix 2: Patch Podfile to resolve Swift 6 MainActor/concurrency errors in ExpoModulesCore
      # Root cause: Xcode 16 enables SWIFT_STRICT_CONCURRENCY=complete by default (Swift 6 mode)
      # ExpoModulesCore 55.x is not yet fully Swift 6 concurrency-compliant
      # Fix: set SWIFT_STRICT_CONCURRENCY=minimal for all pods (matches Swift 5 behavior)
      - name: Patch Podfile for Swift concurrency + disable pod signing
        working-directory: apps/mobile/ios
        run: |
          cat >> Podfile << 'PODFILE_PATCH'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                # Fix Swift 6 MainActor/concurrency errors (ExpoModulesCore, RNWorklets, etc.)
                config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
                # Disable code signing for all pods (not needed for unsigned build)
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              end
            end
          end
          PODFILE_PATCH
          echo "Podfile patched successfully."

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Find workspace and scheme
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "Found workspace: $WORKSPACE"
          echo "=== All schemes ==="
          xcodebuild -workspace "$WORKSPACE" -list 2>&1
          # Pick main app scheme — skip EASClient, Pods, Tests, and Expo helper targets
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>&1 \
            | awk '/Schemes:/,0' \
            | grep -v "Schemes:" \
            | grep -v "^$" \
            | grep -v -i "EASClient\|Pods\|Tests\|ExpoModules\|hermes\|React" \
            | head -1 \
            | xargs)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Selected scheme: $SCHEME"

      # Fix 3: Use `archive` (not `build`) — produces proper .app in xcarchive/Products/Applications
      - name: Archive iOS app (unsigned)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            SKIP_INSTALL=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES

      - name: Package as IPA
        run: |
          set -e
          ARCHIVE="$RUNNER_TEMP/T3Code.xcarchive"
          echo "=== Archive contents ==="
          find "$ARCHIVE" -name "*.app" 2>/dev/null || echo "No .app in archive"

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" \
            -not -name "*.appex" 2>/dev/null | head -1)

          echo "Found app: $APP_PATH"
          [ -z "$APP_PATH" ] && echo "ERROR: No .app found in archive!" && exit 1

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r T3Code-Preview.ipa Payload/
          echo "Done! IPA size: $(du -sh T3Code-Preview.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: T3Code-Preview-IPA
          path: ${{ runner.temp }}/T3Code-Preview.ipa
          retention-days: 7
