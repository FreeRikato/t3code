name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: t3code/mobile-remote-connect

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      - name: Expo prebuild (iOS, skip pod install)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: |
          gem install cocoapods --no-document 2>/dev/null || true
          pod install --repo-update
          echo "=== Pod install complete ==="

      - name: Find workspace and scheme
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "Found workspace: $WORKSPACE"
          echo "=== Available schemes ==="
          xcodebuild -workspace "$WORKSPACE" -list 2>&1
          # Pick the main app scheme — skip EASClient, Pods, and other helper targets
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list 2>&1 | awk '/Schemes:/,0' | grep -v "Schemes:" | grep -v "^$" | grep -v "EASClient" | grep -v "Pods" | grep -v "Tests" | head -1 | xargs)
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Selected scheme: $SCHEME"

      - name: Build iOS app (no code signing)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            SWIFT_VERSION=5 \
            OTHER_SWIFT_FLAGS="-suppress-warnings"

      - name: List DerivedData contents
        if: always()
        run: |
          echo "=== Searching for .app bundles ==="
          find "$RUNNER_TEMP/DerivedData" -name "*.app" 2>/dev/null || echo "No .app found"
          echo ""
          echo "=== Products directory ==="
          find "$RUNNER_TEMP/DerivedData" -type d -name "Products" 2>/dev/null | while read d; do
            echo "--- $d ---"
            ls "$d" 2>/dev/null || true
          done

      - name: Package as IPA
        run: |
          set -e
          # Look in the standard build products location
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -path "*/Release-iphoneos/*.app" \
            -not -name "*.appex" 2>/dev/null | head -1)

          # Fallback: any .app not a plugin
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" \
              -not -path "*/PlugIns/*" \
              -not -name "*.appex" 2>/dev/null | head -1)
          fi

          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found. See 'List DerivedData contents' above."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r T3Code-Preview.ipa Payload/
          echo "Done! IPA size: $(du -sh T3Code-Preview.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: T3Code-Preview-IPA
          path: ${{ runner.temp }}/T3Code-Preview.ipa
          retention-days: 7
