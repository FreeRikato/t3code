name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: t3code/mobile-remote-connect

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Expo CLI
        run: npm install -g @expo/cli

      # @react-native-menu/menu@2.0.0 has Swift source bugs that surface with Xcode 16.4
      # and React Native new architecture. We patch the source in node_modules directly
      # rather than changing app dependencies or updating the package.
      #
      # Errors fixed:
      #   1. FabricActionSheetView.swift        — @objc without Foundation (Xcode 16 strict)
      #   2. FabricViewImplementationProtocol   — UIEdgeInsets needs UIKit import
      #   3. ActionSheetView.swift              — reactSetFrame removed in RN new arch;
      #                                           RCTPresentedViewController is old-arch ObjC
      #   4. MenuViewImplementation.swift       — reactSetFrame same
      #   5. RCTAlertAction.swift               — RCTConvert.uiColor is old-arch ObjC
      #   6. RCTMenuItem.swift                  — same
      #   7. OldArch/Legacy*.swift              — RCTDirectEventBlock old-arch only;
      #                                           exclude from podspec (new arch = Fabric only)
      - name: Patch @react-native-menu/menu (Xcode 16.4 + New Arch compat)
        run: |
          ruby << 'RUBY'
          menu_base = Dir.glob('node_modules/.bun/@react-native-menu+menu*/node_modules/@react-native-menu/menu').first
          unless menu_base
            puts "Warning: @react-native-menu/menu not found, skipping"
            exit 0
          end
          ios = File.join(menu_base, 'ios')
          puts "Patching: #{ios}"

          # 1. FabricActionSheetView.swift — add missing import Foundation
          f = "#{ios}/NewArch/FabricActionSheetView.swift"
          c = File.read(f)
          unless c.include?('import Foundation')
            File.write(f, "import Foundation\n#{c}")
            puts "  ✓ FabricActionSheetView: added import Foundation"
          end

          # 2. FabricViewImplementationProtocol.swift — add missing import UIKit
          f = "#{ios}/NewArch/FabricViewImplementationProtocol.swift"
          c = File.read(f)
          unless c.include?('import UIKit')
            File.write(f, c.sub('import Foundation', "import Foundation\nimport UIKit"))
            puts "  ✓ FabricViewImplementationProtocol: added import UIKit"
          end

          # 3. ActionSheetView.swift
          #    a. Remove reactSetFrame override (no-op; UIView+React category not bridged in new arch)
          #    b. Replace RCTPresentedViewController() with pure UIKit window traversal
          f = "#{ios}/Shared/ActionSheetView.swift"
          c = File.read(f)
          c = c.gsub(/\n +public override func reactSetFrame\(_ frame: CGRect\) \{.*?\}\n/m, "\n")
          c = c.gsub("if let root = RCTPresentedViewController() {",
            "let _kw = UIApplication.shared.connectedScenes\n" \
            "            .compactMap { $0 as? UIWindowScene }.first?.windows\n" \
            "            .first(where: { $0.isKeyWindow })?.rootViewController\n" \
            "        if let root = _kw {")
          File.write(f, c)
          puts "  ✓ ActionSheetView: removed reactSetFrame, replaced RCTPresentedViewController"

          # 4. MenuViewImplementation.swift — remove reactSetFrame override (same reason)
          f = "#{ios}/Shared/MenuViewImplementation.swift"
          c = File.read(f)
          c = c.gsub(/\n +public override func reactSetFrame\(_ frame: CGRect\) \{.*?\}\n/m, "\n")
          File.write(f, c)
          puts "  ✓ MenuViewImplementation: removed reactSetFrame"

          # 5 & 6. RCTAlertAction.swift + RCTMenuItem.swift
          #         Replace RCTConvert.uiColor() with an inline ARGB helper.
          #         React Native encodes colors as NSNumber ARGB integers (0xAARRGGBB).
          color_helper = <<~SWIFT

            // RCTConvert.uiColor replacement (avoids old-arch React-Core ObjC dependency)
            private func _rnColor(_ v: Any) -> UIColor {
              guard let n = v as? NSNumber else { return .clear }
              let c = n.int64Value
              return UIColor(red:   CGFloat((c >> 16) & 0xff) / 255,
                             green: CGFloat((c >>  8) & 0xff) / 255,
                             blue:  CGFloat( c        & 0xff) / 255,
                             alpha: CGFloat((c >> 24) & 0xff) / 255)
            }

          SWIFT

          ['Shared/RCTAlertAction.swift', 'Shared/RCTMenuItem.swift'].each do |rel|
            f = "#{ios}/#{rel}"
            c = File.read(f)
            if c.include?('RCTConvert')
              c = c.sub("import UIKit;\n", "import UIKit;\n#{color_helper}")
              c = c.gsub(/RCTConvert\.uiColor\(([^)]+)\)/, '_rnColor(\1)')
              File.write(f, c)
              puts "  ✓ #{File.basename(f)}: replaced RCTConvert.uiColor"
            end
          end

          # 7. Patch the podspec to exclude OldArch Swift files.
          #    LegacyActionSheetView + LegacyMenuViewImplementation use RCTDirectEventBlock,
          #    an old-arch-only typedef. New arch uses FabricActionSheetView/FabricMenuView.
          #    We keep all ObjC/ObjC++ source (needed for bridging) but drop OldArch Swift.
          ps = "#{menu_base}/react-native-menu.podspec"
          c = File.read(ps)
          if c.include?('"ios/**/*.{h,m,mm,swift}"')
            c = c.sub('"ios/**/*.{h,m,mm,swift}"',
              '"ios/**/*.{h,m,mm}", "ios/NewArch/**/*.swift", "ios/Shared/**/*.swift"')
            File.write(ps, c)
            puts "  ✓ podspec: excluded OldArch Swift (LegacyActionSheet/LegacyMenuView)"
          end

          puts "All @react-native-menu patches applied!"

          # ── react-native-keyboard-controller@1.20.7 ────────────────────────────
          # 19 Swift files are missing import Foundation and/or import UIKit.
          # Xcode 16 is stricter: @objc, NSObject, Notification, NotificationCenter
          # etc. all require explicit Foundation; UIKit types (UITextInput, CGFloat,
          # UIResponder, UIView …) require UIKit.
          # Without Foundation, CocoaPods' bridging header (which makes RCTViewManager,
          # RCTBridge, RCTDirectEventBlock etc. visible from Swift) is never activated —
          # so adding the two imports fixes BOTH the stdlib type errors AND the
          # React-Native ObjC type errors simultaneously.
          kbc_base = Dir.glob('node_modules/.bun/react-native-keyboard-controller*/node_modules/react-native-keyboard-controller').first
          if kbc_base
            puts "\nPatching: #{kbc_base}/ios"
            patched = 0
            Dir.glob("#{kbc_base}/ios/**/*.swift").each do |f|
              c = File.read(f)
              needs_f = !c.include?('import Foundation')
              needs_u = !c.include?('import UIKit')
              next unless needs_f || needs_u
              header = ""
              header += "import Foundation\n" if needs_f
              header += "import UIKit\n"      if needs_u
              File.write(f, header + c)
              added = [needs_f && 'Foundation', needs_u && 'UIKit'].select { |x| x }.join(', ')
              puts "  ✓ #{File.basename(f)}: added #{added}"
              patched += 1
            end
            puts "  #{patched} files patched"
          else
            puts "Warning: react-native-keyboard-controller not found, skipping"
          end

          puts "\nAll source patches applied!"
          RUBY

      - name: Expo prebuild (iOS, skip pod install)
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      # Fix: Patch Pods.xcodeproj AFTER pod install using Ruby + xcodeproj gem.
      # Why not Podfile post_install: CocoaPods only runs the LAST post_install block,
      # and Expo's generated Podfile already has one calling react_native_post_install().
      # Appending a second post_install would silently override Expo's and break new arch.
      # Patching Pods.xcodeproj directly is safe and idempotent.
      - name: Patch Pods.xcodeproj (Swift concurrency + disable pod signing)
        working-directory: apps/mobile/ios
        run: |
          ruby << 'RUBY'
          require 'xcodeproj'

          project_path = 'Pods/Pods.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          project.targets.each do |target|
            target.build_configurations.each do |config|
              # Fix ExpoModulesCore Swift 6 MainActor/concurrency errors on Xcode 16.
              # Xcode 16 sets SWIFT_STRICT_CONCURRENCY=complete by default (Swift 6 mode).
              # ExpoModulesCore 55.x is not yet fully Swift 6 concurrency-compliant.
              # Setting minimal matches Swift 5 concurrency checking behaviour.
              config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'

              # Disable code signing for all pods — not needed for unsigned sideload build.
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
            end
          end

          project.save
          puts "Pods.xcodeproj patched: #{project.targets.count} targets updated."
          RUBY

      - name: Find workspace and scheme
        working-directory: apps/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "WORKSPACE=$WORKSPACE" >> $GITHUB_ENV
          echo "Found workspace: $WORKSPACE"

          # Expo prebuild always names the main app scheme identically to the workspace.
          # e.g. T3CodePreview.xcworkspace → scheme "T3CodePreview"
          # Deriving it this way is more reliable than grep-filtering the scheme list,
          # which previously selected EXConstants (an Expo SDK pod scheme) first.
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "SCHEME=$SCHEME" >> $GITHUB_ENV
          echo "Selected scheme: $SCHEME"

          echo "=== All available schemes (for reference) ==="
          xcodebuild -workspace "$WORKSPACE" -list 2>&1

      - name: Archive iOS app (unsigned)
        working-directory: apps/mobile/ios
        run: |
          # Use archive (not build): produces .app in xcarchive/Products/Applications/
          # Omit -sdk iphoneos: conflicts with -destination on Xcode 16
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE="" \
            SKIP_INSTALL=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            OTHER_SWIFT_FLAGS="-suppress-warnings"

      - name: Package as IPA
        run: |
          set -e
          ARCHIVE="$RUNNER_TEMP/T3Code.xcarchive"

          echo "=== Archive contents ==="
          find "$ARCHIVE" -name "*.app" 2>/dev/null || echo "No .app in archive"

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" \
            -not -name "*.appex" 2>/dev/null | head -1)

          echo "Found app: $APP_PATH"
          [ -z "$APP_PATH" ] && echo "ERROR: No .app found in archive!" && exit 1

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -r T3Code-Preview.ipa Payload/
          echo "Done! IPA size: $(du -sh T3Code-Preview.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: T3Code-Preview-IPA
          path: ${{ runner.temp }}/T3Code-Preview.ipa
          retention-days: 7
